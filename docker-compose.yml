version: '3.8'

services:
  mongo:
    image: mongo:latest
    container_name: task_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    container_name: task_backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/taskmanager
      - JWT_SECRET=supersecret123
    depends_on:
      - mongo

  frontend:
    build: ./frontend
    container_name: task_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo-data:
